<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Every path here is RELATIVE. The app deploys to a GitHub Pages
         project subpath (…/blackjack-trainer/), so a leading slash resolves
         to the domain root, which belongs to someone else entirely. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report
         real values; the CSS already pads the tab bar and screens by those
         insets, and without cover they are all zero and the bar sits under
         the home indicator once installed. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d2318" />

    <!-- iOS ignores most of the manifest, so the standalone launch, the
         status-bar treatment and the home-screen icon are declared again
         here. black-translucent lets the felt run under the status bar,
         which is why the safe-area padding above matters. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BJ Trainer" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <title>Blackjack Trainer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
