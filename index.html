<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Every path here is RELATIVE. The app deploys to a GitHub Pages
         project subpath (…/blackjack-trainer/), so a leading slash resolves
         to the domain root, which belongs to someone else entirely. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to report
         real values; the CSS already pads the tab bar and screens by those
         insets, and without cover they are all zero and the bar sits under
         the home indicator once installed. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d2318" />
    <!-- THE STORED THEME BEFORE THE FIRST PAINT (s09). React applies it too,
         but only after the bundle has loaded and rendered, so a Bone & Ink
         user saw a frame of Midnight green on every launch. Ids and colours
         mirror src/ui/theme.ts (THEMES / THEME_COLOR); scripts/themeColor.test.ts
         keeps them in step. Anything unexpected leaves the default. -->
    <script>
      (function () {
        try {
          var colors = { 'midnight-felt': '#0d2318', 'bone-ink': '#f2ece0', 'amoled-night': '#000000', 'slate-copper': '#15171a' };
          var s = JSON.parse(localStorage.getItem('bjtrainer.settings.v1') || 'null');
          var t = s && s.theme;
          if (typeof t !== 'string' || !Object.prototype.hasOwnProperty.call(colors, t)) return;
          document.documentElement.setAttribute('data-theme', t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', colors[t]);
        } catch (e) {
          /* private mode or a corrupt blob: the default theme stands */
        }
      })();
    </script>

    <!-- iOS ignores most of the manifest, so the standalone launch, the
         status-bar treatment and the home-screen icon are declared again
         here. black-translucent lets the felt run under the status bar,
         which is why the safe-area padding above matters. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Card Counter" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <title>Card Counter</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
