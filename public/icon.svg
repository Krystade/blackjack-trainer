<!--
  THE SOURCE OF TRUTH FOR EVERY ICON PNG in this directory.

  `icon-192`, `icon-512`, `icon-maskable-512` and `apple-touch-icon` are all
  rasterised from this file by `scripts/generate-icons.mjs`. Edit this, run the
  script, commit the PNGs -- never hand-edit a PNG, or the next run reverts it.

  THREE CHIPS, TOP DOWN, ON ONE AXIS.

  The whole layout comes from two constants: the canvas centre (256, 256) and a
  chip radius of 104. The three chips sit on one horizontal line at y = 256
  with centres at x = 152, 256 and 360 -- one radius apart, so each overlaps
  its neighbour by half and the group is exactly symmetric about the vertical
  centreline. Outer chips are drawn first and the pale one last, so the stack
  reads as a fan with a clear top.

  Every chip is the same construction: rim circle, eight edge notches placed by
  one 45-degree rotation loop, a disc that trims the notches' inner ends, a
  ring, and a face. Nothing is positioned by hand, which is what keeps the
  symmetry exact -- the earlier attempt placed elements individually and drifted.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d6340"/>
      <stop offset="0.55" stop-color="#114027"/>
      <stop offset="1" stop-color="#071e12"/>
    </linearGradient>

    <radialGradient id="sheen" cx="0.3" cy="0.16" r="0.9">
      <stop offset="0" stop-color="#7cf0b8" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#7cf0b8" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#7cf0b8" stop-opacity="0"/>
    </radialGradient>

    <!-- Top-down light: brighter at the top of each disc, falling to the base. -->
    <linearGradient id="liftRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2574f"/><stop offset="1" stop-color="#a4241f"/>
    </linearGradient>
    <linearGradient id="liftBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a7fd0"/><stop offset="1" stop-color="#20407a"/>
    </linearGradient>
    <linearGradient id="liftPale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9d3c0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#f6dd93"/><stop offset="0.5" stop-color="#d3a743"/>
      <stop offset="1" stop-color="#9b701d"/>
    </linearGradient>

    <filter id="cast" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#03130a" flood-opacity="0.55"/>
    </filter>

    <path id="spade"
      d="M50 8 C50 8 18 38 18 58 C18 72 28 81 38 81 C44 81 47 78 49 75 C47 87 43 93 36 96 L64 96 C57 93 53 87 51 75 C53 78 56 81 62 81 C72 81 82 72 82 58 C82 38 50 8 50 8 Z"/>

    <!-- One chip. `use` cannot pass colours, so each chip repeats this eight-
         notch loop with its own fills; the geometry below is identical. -->
    <g id="notches">
      <rect x="-14" y="-108" width="28" height="30" rx="7"/>
      <rect x="-14" y="-108" width="28" height="30" rx="7" transform="rotate(45)"/>
      <rect x="-14" y="-108" width="28" height="30" rx="7" transform="rotate(90)"/>
      <rect x="-14" y="-108" width="28" height="30" rx="7" transform="rotate(135)"/>
      <rect x="-14" y="-108" width="28" height="30" rx="7" transform="rotate(180)"/>
      <rect x="-14" y="-108" width="28" height="30" rx="7" transform="rotate(225)"/>
      <rect x="-14" y="-108" width="28" height="30" rx="7" transform="rotate(270)"/>
      <rect x="-14" y="-108" width="28" height="30" rx="7" transform="rotate(315)"/>
    </g>
  </defs>

  <rect width="512" height="512" fill="url(#felt)"/>
  <rect width="512" height="512" fill="url(#sheen)"/>

  <!-- LEFT: red -->
  <g transform="translate(152 256)" filter="url(#cast)">
    <circle r="104" fill="url(#liftRed)"/>
    <use href="#notches" fill="#f7e9e6" opacity="0.94"/>
    <circle r="79" fill="url(#liftRed)"/>
    <circle r="72" fill="none" stroke="#f7e9e6" stroke-width="6" opacity="0.9"/>
    <circle r="56" fill="#f7e9e6" opacity="0.95"/>
    <circle r="56" fill="none" stroke="#8d1c18" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- RIGHT: blue -->
  <g transform="translate(360 256)" filter="url(#cast)">
    <circle r="104" fill="url(#liftBlue)"/>
    <use href="#notches" fill="#e8eefb" opacity="0.94"/>
    <circle r="79" fill="url(#liftBlue)"/>
    <circle r="72" fill="none" stroke="#e8eefb" stroke-width="6" opacity="0.9"/>
    <circle r="56" fill="#e8eefb" opacity="0.95"/>
    <circle r="56" fill="none" stroke="#1b3466" stroke-width="3" opacity="0.5"/>
  </g>

  <!-- CENTRE: pale, on top, carrying the spade so the icon still says cards. -->
  <g transform="translate(256 256)" filter="url(#cast)">
    <circle r="104" fill="url(#liftPale)"/>
    <use href="#notches" fill="#114027" opacity="0.9"/>
    <circle r="79" fill="url(#liftPale)"/>
    <circle r="72" fill="none" stroke="url(#gold)" stroke-width="6"/>
    <circle r="56" fill="#fbf8ef"/>
    <use href="#spade" x="-33" y="-36" width="66" height="66" fill="#12321f"/>
  </g>

  <!-- A single specular arc across the top of the stack, which is what reads
       as "top down" rather than "flat". -->
  <path d="M96 196 A180 180 0 0 1 416 196" fill="none" stroke="#ffffff"
        stroke-width="7" stroke-linecap="round" opacity="0.12"/>
</svg>
